name: Homeis
description: >-
  Homeis was a social networking platform for immigrant and foreign-born
  communities, founded in January 2017 by Ran Harnevo and Hanan Laschover with
  offices in New York City and Tel Aviv. The app matched users by country of
  origin and current city so newcomers could find their community for tips,
  jobs, dating, events, and local services, serving groups such as Israelis in
  the U.S., Latinos in Canada, French-speaking Africans in France, and South
  Asians in the Emirates. It reached more than one million users and raised
  roughly $16 million, including a $12 million Series A led by Canaan Partners
  and Spark Capital. The consumer app shut down in Summer 2021 and never
  reopened; homeis.com is now a parked domain listed for sale. Homeis published
  no public developer program, API, SDK, or documentation surface, so there are
  no API artifacts to enrich for this profile.
